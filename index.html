<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眾神之外</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="meander-strip"></div>
<header class="landing-header">
  <div class="title-oracle-wrap">
    <svg class="oracle-arc" viewBox="0 0 340 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <path id="arcTop" d="M 20 75 Q 170 0 320 75" fill="none"/>
        <path id="arcBottom" d="M 20 25 Q 170 100 320 25" fill="none"/>
      </defs>
      <text font-size="9" fill="#9a93b8" font-family="Cinzel, serif" letter-spacing="3">
        <textPath href="#arcTop" startOffset="50%" text-anchor="middle">WHERE THE GODS END</textPath>
      </text>
      <text font-size="9" fill="#9a93b8" font-family="Cinzel, serif" letter-spacing="3">
        <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">— BEYOND THE DIVINE —</textPath>
      </text>
    </svg>
    <h1>眾神之外</h1>
  </div>
  <p class="oracle-sub gravity-target">From chaos, the gods awaken...<br>From myth, the world breathes...</p>
  <a href="family.html" class="enter-btn">
    <span class="enter-btn-vortex"></span>
    <span class="enter-btn-vortex"></span>
    <span class="enter-btn-vortex"></span>
    <span class="enter-btn-vortex"></span>
    <span class="enter-btn-vortex"></span>
    <span class="enter-btn-vortex"></span>
    <span class="enter-btn-vortex"></span>
    <span class="enter-btn-vortex"></span>
  </a>
</header>

<div class="landing-content">
  <p class="landing-desc">
    深淵無名，唯觀者賦予意義<br>
    <span class="landing-en">The abyss has no name — only the observer gives it meaning</span>
  </p>
</div>

<div class="companion-shadow" id="companionShadow">
  <svg viewBox="0 0 100 200" preserveAspectRatio="xMidYMid meet">
    <defs>
      <filter id="mistBlur" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
      </filter>
      <filter id="mistBlurLight" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="8"/>
      </filter>
    </defs>
    <g class="companion-form" id="companionForm">
      <!-- 核心雾气层 -->
      <g class="comp-core" filter="url(#mistBlur)">
        <!-- 头部 -->
        <ellipse class="comp-head" cx="50" cy="35" rx="8" ry="9"/>
        <ellipse class="comp-head" cx="48" cy="33" rx="6" ry="7"/>
        <ellipse class="comp-head" cx="52" cy="37" rx="5" ry="6"/>
        <!-- 颈部 -->
        <ellipse class="comp-neck" cx="50" cy="48" rx="12" ry="10"/>
        <!-- 肩部 -->
        <ellipse class="comp-shoulder" cx="50" cy="58" rx="14" ry="10"/>
        <ellipse class="comp-shoulder" cx="40" cy="60" rx="8" ry="10"/>
        <ellipse class="comp-shoulder" cx="60" cy="60" rx="8" ry="10"/>
        <!-- 躯干主体 -->
        <ellipse class="comp-body" cx="50" cy="75" rx="18" ry="12"/>
        <ellipse class="comp-body" cx="50" cy="90" rx="17" ry="11"/>
        <ellipse class="comp-body" cx="50" cy="105" rx="16" ry="10"/>
        <ellipse class="comp-body" cx="50" cy="118" rx="14" ry="9"/>
        <ellipse class="comp-body" cx="50" cy="130" rx="12" ry="8"/>
        <ellipse class="comp-body" cx="50" cy="140" rx="10" ry="7"/>
      </g>
      <!-- 脊椎和肋骨 -->
      <g class="comp-ribs">
        <!-- 脊椎主干 -->
        <path d="M 50 48 L 50 75" fill="none" stroke="rgba(255,120,120,0.5)" stroke-width="1.5"/>
        <!-- 肋骨 - 苹果形状，更圆润饱满 -->
        <!-- 第1对 -->
        <path d="M 50 50 C 43 48, 38 53, 37 57 C 40 60, 45 59, 50 58" fill="none" stroke="rgba(255,120,120,0.55)" stroke-width="1"/>
        <path d="M 50 50 C 57 48, 62 53, 63 57 C 60 60, 55 59, 50 58" fill="none" stroke="rgba(255,120,120,0.55)" stroke-width="1"/>
        <!-- 第2对 -->
        <path d="M 50 53 C 42 50, 37 56, 36 60 C 39 63, 44 62, 50 61" fill="none" stroke="rgba(255,120,120,0.5)" stroke-width="1"/>
        <path d="M 50 53 C 58 50, 63 56, 64 60 C 61 63, 56 62, 50 61" fill="none" stroke="rgba(255,120,120,0.5)" stroke-width="1"/>
        <!-- 第3对 -->
        <path d="M 50 56 C 41 52, 36 59, 35 63 C 38 66, 44 65, 50 64" fill="none" stroke="rgba(255,120,120,0.45)" stroke-width="1"/>
        <path d="M 50 56 C 59 52, 64 59, 65 63 C 62 66, 56 65, 50 64" fill="none" stroke="rgba(255,120,120,0.45)" stroke-width="1"/>
        <!-- 第4对 -->
        <path d="M 50 59 C 40 54, 35 62, 34 66 C 37 69, 43 68, 50 67" fill="none" stroke="rgba(255,120,120,0.4)" stroke-width="1"/>
        <path d="M 50 59 C 60 54, 65 62, 66 66 C 63 69, 57 68, 50 67" fill="none" stroke="rgba(255,120,120,0.4)" stroke-width="1"/>
        <!-- 第5对 -->
        <path d="M 50 62 C 39 56, 34 65, 33 69 C 36 72, 43 71, 50 70" fill="none" stroke="rgba(255,120,120,0.35)" stroke-width="1"/>
        <path d="M 50 62 C 61 56, 66 65, 67 69 C 64 72, 57 71, 50 70" fill="none" stroke="rgba(255,120,120,0.35)" stroke-width="1"/>
        <!-- 第6对 -->
        <path d="M 50 65 C 38 58, 33 68, 32 72 C 35 75, 42 74, 50 73" fill="none" stroke="rgba(255,120,120,0.3)" stroke-width="1"/>
        <path d="M 50 65 C 62 58, 67 68, 68 72 C 65 75, 58 74, 50 73" fill="none" stroke="rgba(255,120,120,0.3)" stroke-width="1"/>
        <!-- 第7对 -->
        <path d="M 50 68 C 37 60, 32 71, 31 75 C 34 78, 42 77, 50 76" fill="none" stroke="rgba(255,120,120,0.25)" stroke-width="1"/>
        <path d="M 50 68 C 63 60, 68 71, 69 75 C 66 78, 58 77, 50 76" fill="none" stroke="rgba(255,120,120,0.25)" stroke-width="1"/>
      </g>
      <!-- 边缘雾气 -->
      <g class="comp-edge" filter="url(#mistBlur)">
        <ellipse cx="38" cy="68" rx="8" ry="12"/>
        <ellipse cx="62" cy="70" rx="7" ry="10"/>
        <ellipse cx="40" cy="88" rx="7" ry="10"/>
        <ellipse cx="60" cy="90" rx="6" ry="9"/>
        <ellipse cx="42" cy="108" rx="6" ry="9"/>
        <ellipse cx="58" cy="110" rx="5" ry="8"/>
        <ellipse cx="44" cy="125" rx="5" ry="7"/>
        <ellipse cx="56" cy="127" rx="5" ry="7"/>
      </g>
      <!-- 外层光晕 -->
      <g class="comp-halo" filter="url(#mistBlurLight)">
        <ellipse cx="50" cy="42" rx="18" ry="20"/>
        <ellipse cx="50" cy="76" rx="18" ry="16"/>
        <ellipse cx="50" cy="108" rx="16" ry="14"/>
        <ellipse cx="50" cy="135" rx="10" ry="8" fill="rgba(200, 195, 220, 0.04)"/>
        <ellipse cx="36" cy="64" rx="10" ry="14"/>
        <ellipse cx="64" cy="66" rx="9" ry="12"/>
        <ellipse cx="38" cy="98" rx="9" ry="13"/>
        <ellipse cx="62" cy="100" rx="8" ry="11"/>
        <ellipse cx="40" cy="125" rx="5" ry="6" fill="rgba(200, 195, 220, 0.04)"/>
        <ellipse cx="60" cy="127" rx="5" ry="6" fill="rgba(200, 195, 220, 0.04)"/>
      </g>
    </g>
  </svg>
</div>

<script src="app.js"></script>
</body>
</html>
