<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>希臘神系圖譜</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="meander-strip"></div>
<header>
  <h1>希臘神系圖譜</h1>
  <p>從混沌到英雄 — 點擊圖章，探索諸神的血緣與故事</p>
  <p class="progress-counter" id="progressCounter">已探索 0 / 0</p>
</header>
<div class="meander-strip"></div>

<nav class="progress-rail" id="progressRail"></nav>

<div class="legend" id="legend">
  <button data-gen="primordial" style="--dot:#3B2E42" onclick="jumpTo('primordial')"><span class="dot"></span>創世 · 原初神</button>
  <button data-gen="titan" style="--dot:#6B4A2F" onclick="jumpTo('titan')"><span class="dot"></span>泰坦神族</button>
  <button data-gen="olympian" style="--dot:#1F4959" onclick="jumpTo('olympian')"><span class="dot"></span>奧林帕斯十二主神</button>
  <button data-gen="hero" style="--dot:#B5502E" onclick="jumpTo('hero')"><span class="dot"></span>凡間英雄</button>
  <button data-gen="nature" style="--dot:#4B6B3A" onclick="jumpTo('nature')"><span class="dot"></span>自然精靈與野性之神</button>
  <button data-gen="zodiac" style="--dot:#3D3A6B" onclick="jumpTo('zodiac')"><span class="dot"></span>黃道十二宮</button>
  <button data-gen="troy" style="--dot:#6B2E3A" onclick="jumpTo('troy')"><span class="dot"></span>特洛伊戰爭與奧德賽</button>
</div>

<div class="layout">
  <div class="tree-wrap" id="treeWrap">
    <svg id="connections"></svg>

    <div class="gen-section" id="sec-primordial">
      <div class="gen-label"><span>創世 · 原初神 Primordial</span></div>
      <div class="gen-row" data-row="primordial"></div>
    </div>

    <div class="gen-section" id="sec-titan">
      <div class="gen-label"><span>泰坦神族 Titans</span></div>
      <div class="gen-row" data-row="titan"></div>
    </div>

    <div class="gen-section" id="sec-olympian">
      <div class="gen-label"><span>奧林帕斯十二主神 Olympians</span></div>
      <div class="gen-row" data-row="olympian"></div>
    </div>

    <div class="gen-section" id="sec-hero">
      <div class="gen-label"><span>凡間英雄 Heroes</span></div>
      <div class="gen-row" data-row="hero"></div>
    </div>

    <div class="gen-section" id="sec-nature">
      <div class="gen-label"><span>自然精靈與野性之神 Nature Spirits</span></div>
      <div class="gen-row" data-row="nature"></div>
    </div>

    <div class="gen-section" id="sec-zodiac">
      <div class="gen-label"><span>黃道十二宮 Zodiac</span></div>
      <div class="gen-row" data-row="zodiac"></div>
    </div>

    <div class="gen-section" id="sec-troy">
      <div class="gen-label"><span>特洛伊戰爭與奧德賽 Trojan War &amp; Odyssey</span></div>
      <div class="gen-row" data-row="troy"></div>
    </div>
  </div>

  <aside class="detail-panel" id="detailPanel">
    <button class="close-btn" onclick="closePanel()">✕</button>
    <div class="detail-empty" id="detailEmpty">
      <span class="icon">⚱</span>
      點選任一圖章<br>查看該神祇的身世與故事
    </div>
    <div id="detailContent" style="display:none;"></div>
  </aside>
</div>

<footer>原型 Prototype · 資料為簡化版本，供學習與探索使用</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
